name: CI ML Churn

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Génération des données et entraînement
        run: |
          python src/generate_data.py
          python src/train.py

      - name: Tests unitaires et API
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t ml-churn-api:${{ github.sha }} .

      - name: Smoke test du conteneur
        run: |
          docker run -d --name ml-churn-api -p 8000:8000 ml-churn-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":35,"anciennete":5,"revenu":450000,"nb_reclamations":2,"montant_mensuel":25000,"retards_paiement":2}'
          docker rm -f ml-churn-api
