input {
  file {
    path => "/usr/share/logstash/logs/api.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_api"
    codec => json
    ecs_compatibility => disabled
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ssZ"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["path", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ml-churn-logs-%{+YYYY.MM.dd}"
  }
}
